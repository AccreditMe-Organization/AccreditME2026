name: AccreditMe CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────
  # Stage 1 — Repository structure validation
  # ─────────────────────────────────────────────
  validate-repo:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Confirm required files exist
        run: |
          echo "Checking repository structure..."
          test -f .gitignore && echo "✅ .gitignore found" || (echo "❌ .gitignore missing" && exit 1)
          test -f .github/workflows/ci.yml && echo "✅ ci.yml found" || (echo "❌ ci.yml missing" && exit 1)
          echo "✅ Repository structure check passed"

      - name: Confirm no secrets committed
        run: |
          echo "Checking for accidentally committed secret files..."
          ! test -f .env && echo "✅ .env not committed" || (echo "❌ .env file found in repo — remove it immediately" && exit 1)
          ! test -f .mcp.json && echo "✅ .mcp.json not committed" || echo "⚠️  .mcp.json found — ensure it contains no secrets"
          echo "✅ Secret file check passed"

  # ─────────────────────────────────────────────
  # Stage 1b — Dependency vulnerability scan
  # ─────────────────────────────────────────────
  dependencies:
    name: Dependencies — Vulnerability Scan
    runs-on: ubuntu-latest
    needs: validate-repo
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.workspace }}

      - name: Capture audit report
        working-directory: ${{ matrix.workspace }}
        # `npm audit` exits non-zero whenever ANY finding exists, so its own
        # exit code cannot be the gate — capture the JSON and let the gate
        # script decide. `|| true` keeps the step green so the script runs.
        run: npm audit --json > audit.json || true

      - name: Audit gate — fail only on findings with no fix available
        # ONE script for both workspaces, run from the repo root rather than
        # copied into each. See CLAUDE.md's note on skill verification
        # commands being duplicated with no shared source (ACC-73) — the same
        # trap, avoided here.
        run: node .github/scripts/audit-gate.js ${{ matrix.workspace }}/audit.json ${{ matrix.workspace }}

  # ─────────────────────────────────────────────
  # Stage 2 — Backend
  # ─────────────────────────────────────────────
  backend:
    name: Backend — Type Check, Test, Migrations
    runs-on: ubuntu-latest
    needs: validate-repo
    services:
      postgres:
        # Matches accreditme-production's Supabase Postgres engine (17.6.1)
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma Client
        # Required before tsc/jest -- code imports from generated/prisma/client,
        # which is gitignored and only exists after this runs. Not a DB
        # operation (schema.prisma -> generated code only), so it doesn't
        # need the postgres service container below.
        run: npx prisma generate
        working-directory: backend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend
      # ACC-120 — DISCOVERED from package.json, like the frontend's. One script
      # today (check:worker-gate, ACC-92) and naming it here is what would make
      # the second one invisible, which is exactly how the frontend lost two.
      - name: Static checks (discovered)
        working-directory: backend
        run: |
          scripts=$(node -e "const s=require('./package.json').scripts||{};console.log(Object.keys(s).filter(k=>k.startsWith('check:')).join(' '))")
          if [ -z "$scripts" ]; then
            echo "::error::No check:* scripts discovered — discovery is broken, not the app."
            exit 1
          fi
          failed=0
          for script in $scripts; do
            if npm run "$script" --silent; then
              echo "::notice::$script passed"
            else
              echo "::error::$script FAILED"
              failed=1
            fi
          done
          exit $failed
      - name: Run unit tests
        run: npx jest --passWithNoTests
        working-directory: backend
      - name: Apply migrations to ephemeral database
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          # Ephemeral per-run container — no secret needed, nothing to leak.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

  # ─────────────────────────────────────────────
  # Stage 3 — Frontend
  # ─────────────────────────────────────────────
  frontend:
    # ACC-47 — renamed from "Frontend — Lint, Type Check, Build": this job
    # has never actually linted (no ESLint config/script exists anywhere
    # in the frontend), so the old name was inaccurate on its own terms
    # even before the missing-test-step gap. No lint infrastructure exists
    # to wire up cheaply here — adding real linting is a separate, much
    # larger undertaking (choosing rules, likely fixing/suppressing a
    # first wave of violations across the whole codebase) that deserves
    # its own ticket, not a silent scope-add to this one. Renamed instead
    # to state plainly what this job actually does.
    name: Frontend — Type Check, Test, Build
    runs-on: ubuntu-latest
    needs: validate-repo
    # ACC-47 — hard backstop: a genuine Chrome-launch hang in CI should
    # fail in minutes, not consume the default multi-hour job timeout.
    # karma.conf.js's own captureTimeout/browserDisconnectTimeout/
    # browserNoActivityTimeout should fire well before this does.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      # ACC-47 — pinned Chrome version rather than trusting whatever
      # happens to be preinstalled on the ubuntu-latest runner image
      # (which drifts across runner image updates).
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      # ACC-109 — the proof for the CHROME_BIN line further down, because CI
      # cannot otherwise show it worked. If CHROME_BIN were unset, karma would
      # fall back to the runner image's own Chrome and the job would still be
      # GREEN — so a passing run is equally consistent with the pinning working
      # and with it being silently dead. These two lines are what tell the two
      # apart: they name the binary that the tests are about to use.
      # It also fails loudly rather than quietly if the output ever goes away
      # (a renamed output makes this `"" --version`, which is not a command),
      # so the fallback cannot return unnoticed.
      - name: Confirm the pinned Chrome is the one the tests will use
        run: |
          echo "CHROME_BIN=$CHROME_BIN"
          "$CHROME_BIN" --version
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend
      # ACC-120 — EVERY check:* SCRIPT, DISCOVERED FROM package.json RATHER THAN
      # LISTED HERE.
      #
      # This replaced eight hand-written steps, and the reason is a defect the
      # list had the moment a ninth scan was written: check:field-control and
      # check:confirm-translated were added, passed locally, and were NOT IN CI.
      # A scan that exists but is not wired to the gate is a vacuous pass in a
      # new costume, and nothing would have said so, because a green build looks
      # identical either way.
      #
      # /ready-to-pr already discovers them this way, for this exact reason, and
      # CI not doing the same was the drift. It is also the principle the scans
      # themselves now follow: key off the thing, never off a list of where the
      # thing occurs.
      #
      # The commentary that used to live here went with the steps, into each
      # script's own header, where a reader of the scan finds it.
      #
      # FAILS THE BUILD, reporting every script by name so the list can be
      # compared against the repo. Discovery finding NOTHING is itself a
      # failure: an empty list is how this step would silently stop checking.
      - name: Static checks (discovered)
        working-directory: frontend
        run: |
          scripts=$(node -e "const s=require('./package.json').scripts||{};console.log(Object.keys(s).filter(k=>k.startsWith('check:')).join(' '))")
          if [ -z "$scripts" ]; then
            echo "::error::No check:* scripts discovered — discovery is broken, not the app."
            exit 1
          fi
          failed=0
          for script in $scripts; do
            if npm run "$script" --silent; then
              echo "::notice::$script passed"
            else
              echo "::error::$script FAILED"
              failed=1
            fi
          done
          exit $failed

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Build Angular app
        run: npm run build
        working-directory: frontend
      # ACC-130 — the BUILT page must run under vercel.json's CSP (script-src
      # 'self'): no inline event handler, no inline script. Checks the output,
      # not angular.json, so it catches whatever reintroduces one. Not a
      # check:* script because it needs the build first.
      - name: The built index.html has no inline script
        run: npm run verify:built-index
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Stage 4 — Tenant isolation tests
  # ─────────────────────────────────────────────
  tenant-isolation:
    name: Tenant Isolation Tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend
      - name: Run tenant isolation tests
        # No DATABASE_URL here — every isolation test mocks PrismaService
        # directly (Test.createTestingModule's useValue), so no real
        # database connection is ever made by this step.
        run: npx jest --testNamePattern="should NOT return records belonging to a different tenant" --passWithNoTests
        working-directory: backend
