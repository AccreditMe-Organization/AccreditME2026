name: AccreditMe CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────
  # Stage 1 — Repository structure validation
  # ─────────────────────────────────────────────
  validate-repo:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm required files exist
        run: |
          echo "Checking repository structure..."
          test -f .gitignore && echo "✅ .gitignore found" || (echo "❌ .gitignore missing" && exit 1)
          test -f .github/workflows/ci.yml && echo "✅ ci.yml found" || (echo "❌ ci.yml missing" && exit 1)
          echo "✅ Repository structure check passed"

      - name: Confirm no secrets committed
        run: |
          echo "Checking for accidentally committed secret files..."
          ! test -f .env && echo "✅ .env not committed" || (echo "❌ .env file found in repo — remove it immediately" && exit 1)
          ! test -f .mcp.json && echo "✅ .mcp.json not committed" || echo "⚠️  .mcp.json found — ensure it contains no secrets"
          echo "✅ Secret file check passed"

  # ─────────────────────────────────────────────
  # Stage 2 — Backend
  # ─────────────────────────────────────────────
  backend:
    name: Backend — Type Check, Test, Migrations
    runs-on: ubuntu-latest
    needs: validate-repo
    services:
      postgres:
        # Matches accreditme-production's Supabase Postgres engine (17.6.1)
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma Client
        # Required before tsc/jest -- code imports from generated/prisma/client,
        # which is gitignored and only exists after this runs. Not a DB
        # operation (schema.prisma -> generated code only), so it doesn't
        # need the postgres service container below.
        run: npx prisma generate
        working-directory: backend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend
      - name: Run unit tests
        run: npx jest --passWithNoTests
        working-directory: backend
      - name: Apply migrations to ephemeral database
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          # Ephemeral per-run container — no secret needed, nothing to leak.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

  # ─────────────────────────────────────────────
  # Stage 3 — Frontend
  # ─────────────────────────────────────────────
  frontend:
    # ACC-47 — renamed from "Frontend — Lint, Type Check, Build": this job
    # has never actually linted (no ESLint config/script exists anywhere
    # in the frontend), so the old name was inaccurate on its own terms
    # even before the missing-test-step gap. No lint infrastructure exists
    # to wire up cheaply here — adding real linting is a separate, much
    # larger undertaking (choosing rules, likely fixing/suppressing a
    # first wave of violations across the whole codebase) that deserves
    # its own ticket, not a silent scope-add to this one. Renamed instead
    # to state plainly what this job actually does.
    name: Frontend — Type Check, Test, Build
    runs-on: ubuntu-latest
    needs: validate-repo
    # ACC-47 — hard backstop: a genuine Chrome-launch hang in CI should
    # fail in minutes, not consume the default multi-hour job timeout.
    # karma.conf.js's own captureTimeout/browserDisconnectTimeout/
    # browserNoActivityTimeout should fire well before this does.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      # ACC-47 — pinned Chrome version rather than trusting whatever
      # happens to be preinstalled on the ubuntu-latest runner image
      # (which drifts across runner image updates).
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend
      # ACC-47 — the actual gap this ticket exists to close: this frontend
      # job never ran any test-runner step before, at any point in this
      # repo's history (confirmed via full commit-history audit, not a
      # regression). ChromeHeadlessCI (karma.conf.js) adds --no-sandbox
      # etc. for the containerized runner. Placed before the build step,
      # matching the backend job's own tsc -> test -> (expensive step)
      # ordering — fail fast on a test failure before spending time on a
      # full production build.
      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
        working-directory: frontend
      - name: Build Angular app
        run: npm run build
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Stage 4 — Tenant isolation tests
  # ─────────────────────────────────────────────
  tenant-isolation:
    name: Tenant Isolation Tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend
      - name: Run tenant isolation tests
        # No DATABASE_URL here — every isolation test mocks PrismaService
        # directly (Test.createTestingModule's useValue), so no real
        # database connection is ever made by this step.
        run: npx jest --testNamePattern="should NOT return records belonging to a different tenant" --passWithNoTests
        working-directory: backend
